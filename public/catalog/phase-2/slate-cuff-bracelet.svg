<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title description" data-product="slate-cuff-bracelet" data-category="bracelet">
  <title id="title">Slate Cuff Bracelet — gunmetal bracelet</title>
  <desc id="description">Original project-owned illustration for the Slate Cuff Bracelet demo product.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101216"/>
      <stop offset="1" stop-color="#262a31"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#4c555d" stop-opacity=".34"/>
      <stop offset="1" stop-color="#4c555d" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="800" height="800" rx="42" fill="url(#background)"/>
