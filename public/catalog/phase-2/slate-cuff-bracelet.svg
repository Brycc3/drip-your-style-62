  <circle cx="110" cy="110" r="70" fill="none" stroke="#b6c0c7" stroke-opacity=".18" stroke-width="2"/><circle cx="690" cy="690" r="70" fill="none" stroke="#b6c0c7" stroke-opacity=".18" stroke-width="2"/>
  <g filter="url(#shadow)"><ellipse cx="400" cy="398" rx="230" ry="160" fill="none" stroke="#4c555d" stroke-width="52" stroke-dasharray="38 10"/>
      <circle cx="628" cy="398" r="36" fill="#b6c0c7" stroke="#f7f7f2" stroke-width="9"/></g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <text x="400" y="710" fill="#f7f7f2" font-size="24" font-weight="700" letter-spacing="2">Slate Cuff Bracelet</text>
    <text x="400" y="746" fill="#b6c0c7" font-size="15" font-weight="700" letter-spacing="4">GUNMETAL · BRACELET</text>
  </g>
  <rect x="22" y="22" width="756" height="756" rx="30" fill="none" stroke="#fff" stroke-opacity=".15" stroke-width="2"/>
