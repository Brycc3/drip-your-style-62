<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title description" data-product="mini-arc-hoops" data-category="earrings">
  <title id="title">Mini Arc Hoops — silver earrings</title>
  <desc id="description">Original project-owned illustration for the Mini Arc Hoops demo product.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101216"/>
