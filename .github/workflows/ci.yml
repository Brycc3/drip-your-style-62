name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_only
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_only
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint:changed

      - name: Tests
        run: bun test

      - name: Production build
        run: npm run build

      - name: Catalog assets
        run: npm run catalog:check

      - name: Confirm .env is untracked
        run: test -z "$(git ls-files .env)"

      - name: Safe secret-pattern scan
        run: npm run secrets:check

      - name: Safe secret-pattern history scan
        run: npm run secrets:history

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Prove the fresh database path
        run: bash scripts/verify-phase4a-database-path.sh fresh

      - name: Prove the existing database upgrade path
        run: bash scripts/verify-phase4a-database-path.sh existing-upgrade
